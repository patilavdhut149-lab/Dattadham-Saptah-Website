{% extends "base.html" %}{% block title %}प्रशासक लॉगिन{% endblock %}{% block content %}
<main class="wrap narrow"><section class="card login-card"><div class="lock">🔒</div><h1>प्रशासक लॉगिन</h1><p class="muted center">अखिल भारतीय श्री स्वामी समर्थ गुरुपीठ</p>
<form method="post">{% csrf_token %}<div class="field"><label>वापरकर्ता नाव (Username)</label><input name="username" required autocomplete="username" placeholder="वापरकर्ता नाव प्रविष्ट करा"></div><div class="field"><label>पासवर्ड (Password)</label><input type="password" name="password" required autocomplete="current-password" placeholder="पासवर्ड प्रविष्ट करा"></div><button class="primary-btn">लॉगिन करा</button></form></section></main>
{% endblock %}
